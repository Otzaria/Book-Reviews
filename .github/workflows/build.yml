name: Build

# כל push ל-main (ובהרצה ידנית) בונה את התוכנה ל-Windows ומפרסם Release בגרסה הבאה.
# שיטת הגרסאות: vMAJOR.MINOR.PATCH. נלקח התג הגבוה ביותר מהצורה v<מספר>.<מספר>.<מספר>,
# והמספר האחרון עולה ב-1 (v1.0.7 ← v1.0.8). בלי תג קודם: v1.0.1.
# לשינוי MAJOR/MINOR יוצרים ידנית תג חדש (למשל v1.1.0) — הריצה הבאה תמשיך ממנו (v1.1.1).
on:
  workflow_dispatch:
  push:
    branches: [main]

# ריצה אחת בכל פעם, בלי לבטל ריצה שכבר התחילה: כך שתי ריצות לא יחשבו את אותו מספר גרסה.
concurrency:
  group: release-build
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      number: ${{ steps.ver.outputs.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: ver
        run: |
          git fetch --tags --force
          last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          if [ -z "$last" ]; then
            tag="v1.0.1"
          else
            IFS=. read -r a b c <<< "${last#v}"
            tag="v$a.$b.$((c+1))"
          fi
          echo "last=$last next=$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "number=${tag#v}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: הפעלת פלטפורמת Windows
        run: flutter config --enable-windows-desktop

      - run: flutter pub get

      - name: ניתוח סטטי
        run: flutter analyze
        continue-on-error: true

      # בדיקות שתלויות במאגרים מקומיים (otzaria-library) מדלגות כשהן חסרות.
      - name: בדיקות
        run: flutter test

      - name: בנייה
        run: flutter build windows --release --build-name=${{ needs.version.outputs.number }} --dart-define=APP_VERSION=${{ needs.version.outputs.number }}

      # exe יחיד שרץ בלי התקנה (7-Zip SFX): מחלץ את עצמו לתיקייה זמנית ומריץ משם.
      - name: אריזת exe יחיד ו-zip
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.7-zip.org/a/7zr.exe -OutFile 7zr.exe
          Invoke-WebRequest https://www.7-zip.org/a/lzma2301.7z -OutFile lzma.7z
          ./7zr.exe x -y -olzma lzma.7z | Out-Null
          # אייקון התוכנה על קובץ ה-exe היחיד, ומניפסט asInvoker (בלי אישור מנהל)
          Invoke-WebRequest https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe -OutFile rcedit.exe
          ./rcedit.exe lzma/bin/7zS2.sfx --set-icon windows/runner/resources/app_icon.ico --application-manifest windows/runner/sfx.manifest
          ./7zr.exe a -mx=9 payload.7z ./build/windows/x64/runner/Release/* | Out-Null
          $cfg = ";!@Install@!UTF-8!`nTitle=`"בודק המרות לאוצריא`"`nRunProgram=`"OtzariaBookChecker.exe`"`nGUIMode=`"2`"`n;!@InstallEnd@!`n"
          [IO.File]::WriteAllText("$PWD\cfg.txt", $cfg, (New-Object Text.UTF8Encoding($false)))
          $out = [IO.File]::Create("$PWD\OtzariaBookChecker.exe")
          foreach ($f in @("lzma/bin/7zS2.sfx", "cfg.txt", "payload.7z")) {
            $b = [IO.File]::ReadAllBytes("$PWD\$f"); $out.Write($b, 0, $b.Length)
          }
          $out.Close()
          Compress-Archive -Path ./build/windows/x64/runner/Release/* -DestinationPath OtzariaBookChecker-windows.zip
          Get-Item OtzariaBookChecker.exe, OtzariaBookChecker-windows.zip | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: OtzariaBookChecker-windows
          path: |
            OtzariaBookChecker.exe
            OtzariaBookChecker-windows.zip
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: בודק המרות לאוצריא ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            dist/OtzariaBookChecker.exe
            dist/OtzariaBookChecker-windows.zip
